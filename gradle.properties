# Project-wide Gradle settings.

# JVM args for the Gradle daemon — raise heap so KSP/Compose don't OOM.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError

# Run daemons in parallel + configure on demand for faster builds.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true

# AndroidX — required for Jetpack Compose.
android.useAndroidX=true

# Kotlin code style.
kotlin.code.style=official

# Non-transitive R classes — smaller R class per module, faster builds.
android.nonTransitiveRClass=true
